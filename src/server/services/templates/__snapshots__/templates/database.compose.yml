services:
  db:
    image: postgres:18.6
    restart: unless-stopped
    stop_grace_period: 60s
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - data:/var/lib/postgresql
    shm_size: 128mb
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -q -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 30s
    container_name: database-0123abcd-db
    networks:
      default: {}
    labels:
      nitrobase.app: 0123abcd-0000-4000-8000-00000000c0de
      nitrobase.service: db
    deploy:
      resources:
        limits:
          memory: 512M
volumes:
  data:
    labels:
      nitrobase.app: 0123abcd-0000-4000-8000-00000000c0de
networks:
  default:
    internal: true
name: database-0123abcd
