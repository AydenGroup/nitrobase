http:
  routers:
    app-0123abcd0000-0-http:
      rule: Host(`app.example.org`)
      entryPoints:
        - web
      middlewares:
        - app-0123abcd0000-https-redirect
      service: app-0123abcd0000-0
    app-0123abcd0000-0:
      rule: Host(`app.example.org`)
      entryPoints:
        - websecure
      service: app-0123abcd0000-0
      tls:
        certResolver: letsencrypt
    app-0123abcd0000-1-http:
      rule: Host(`app.example.org`) && PathPrefix(`/v1`)
      entryPoints:
        - web
      middlewares:
        - app-0123abcd0000-https-redirect
      service: app-0123abcd0000-1
    app-0123abcd0000-1:
      rule: Host(`app.example.org`) && PathPrefix(`/v1`)
      entryPoints:
        - websecure
      service: app-0123abcd0000-1
      tls:
        certResolver: letsencrypt
    app-0123abcd0000-2-http:
      rule: Host(`app.example.org`) && PathPrefix(`/.well-known`)
      entryPoints:
        - web
      middlewares:
        - app-0123abcd0000-https-redirect
      service: app-0123abcd0000-2
    app-0123abcd0000-2:
      rule: Host(`app.example.org`) && PathPrefix(`/.well-known`)
      entryPoints:
        - websecure
      service: app-0123abcd0000-2
      tls:
        certResolver: letsencrypt
    app-0123abcd0000-3-http:
      rule: Host(`app.example.org`) && PathPrefix(`/v1/realtime`)
      entryPoints:
        - web
      middlewares:
        - app-0123abcd0000-https-redirect
      service: app-0123abcd0000-3
    app-0123abcd0000-3:
      rule: Host(`app.example.org`) && PathPrefix(`/v1/realtime`)
      entryPoints:
        - websecure
      service: app-0123abcd0000-3
      tls:
        certResolver: letsencrypt
  services:
    app-0123abcd0000-0:
      loadBalancer:
        servers:
          - url: http://appwrite-0123abcd-appwrite-console:3000
    app-0123abcd0000-1:
      loadBalancer:
        servers:
          - url: http://appwrite-0123abcd-appwrite:80
    app-0123abcd0000-2:
      loadBalancer:
        servers:
          - url: http://appwrite-0123abcd-appwrite:80
    app-0123abcd0000-3:
      loadBalancer:
        servers:
          - url: http://appwrite-0123abcd-appwrite-realtime:80
  middlewares:
    app-0123abcd0000-https-redirect:
      redirectScheme:
        scheme: https
        permanent: true
