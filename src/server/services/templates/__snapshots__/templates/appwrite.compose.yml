    volumes:
      - appwrite-postgresql:/var/lib/postgresql:rw
    environment:
      - POSTGRES_DB=${_APP_DB_SCHEMA}
      - POSTGRES_USER=${_APP_DB_USER}
      - POSTGRES_PASSWORD=${_APP_DB_PASS}
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${_APP_DB_USER} -d ${_APP_DB_SCHEMA}
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    command:
      - postgres
    labels:
      nitrobase.app: 0123abcd-0000-4000-8000-00000000c0de
      nitrobase.service: postgresql
  redis:
    image: redis:7.4.7-alpine
    logging:
      driver: json-file
      options:
        max-file: "5"
        max-size: 10m
    container_name: appwrite-0123abcd-redis
    command:
      - redis-server
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - allkeys-lru
      - --maxmemory-samples
      - "5"
    networks:
      appwrite:
        aliases:
          - appwrite-redis
    volumes:
      - appwrite-redis:/data:rw
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 5s
      retries: 12
    labels:
      nitrobase.app: 0123abcd-0000-4000-8000-00000000c0de
      nitrobase.service: redis
