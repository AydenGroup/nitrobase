      nitrobase.service: appwrite-autogravity
  clickhouse:
    image: clickhouse/clickhouse-server:26.4.3-alpine
    restart: unless-stopped
    networks:
      appwrite: {}
    environment:
      - CLICKHOUSE_DB=appwrite
      - CLICKHOUSE_USER=appwrite
