      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
    volumes:
      - appwrite-clickhouse:/var/lib/clickhouse:rw
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test:
        - CMD-SHELL
        - clickhouse-client --user "$$CLICKHOUSE_USER" --password "$$CLICKHOUSE_PASSWORD" --query "SELECT 1" >/dev/null
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    container_name: appwrite-0123abcd-clickhouse
    labels:
      nitrobase.app: 0123abcd-0000-4000-8000-00000000c0de
      nitrobase.service: clickhouse
  appwrite-geo:
    container_name: appwrite-0123abcd-appwrite-geo
    logging:
      driver: json-file
      options:
        max-file: "5"
        max-size: 10m
    image: appwrite/geo:0.3.1
    restart: unless-stopped
    networks:
      appwrite: {}
    environment:
      - GEO_SECRET=$_APP_GEO_SECRET
    healthcheck:
      test: "php -r \"exit(json_decode(file_get_contents('http://localhost/v1/health'))->status === 'ok' ? 0 : 1);\""
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    labels:
      nitrobase.app: 0123abcd-0000-4000-8000-00000000c0de
      nitrobase.service: appwrite-geo
