    image: mongo:8.2.5
    container_name: appwrite-0123abcd-mongodb
    logging:
      driver: json-file
      options:
        max-file: "5"
        max-size: 10m
    restart: unless-stopped
    networks:
      appwrite:
        aliases:
          - appwrite-mongodb
    volumes:
      - appwrite-mongodb:/data/db
      - appwrite-mongodb-keyfile:/data/keyfile
      - /etc/nitrobase/apps/appwrite-0123abcd/mongo-init.js:/mongo-init.js:ro
      - /etc/nitrobase/apps/appwrite-0123abcd/mongo-entrypoint.sh:/mongo-entrypoint.sh:ro
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=${_APP_DB_ROOT_PASS}
      - MONGO_INITDB_DATABASE=${_APP_DB_SCHEMA}
      - MONGO_INITDB_USERNAME=${_APP_DB_USER}
      - MONGO_INITDB_PASSWORD=${_APP_DB_PASS}
    entrypoint:
      - /bin/bash
      - /mongo-entrypoint.sh
    healthcheck:
      test: |
        bash -c "
          mongosh -u root -p ${_APP_DB_ROOT_PASS} --authenticationDatabase admin --quiet --eval \"
            try {
              const hello = db.adminCommand({hello: 1});
              if (hello.isWritablePrimary && hello.setName === 'rs0') {
                quit(0);
              }
            } catch (e) {}

            try {
              rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'appwrite-mongodb:27017'}]});
            } catch (e) {}

            quit(1);
          \" 2>/dev/null
        "
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s
    labels:
      nitrobase.app: 0123abcd-0000-4000-8000-00000000c0de
      nitrobase.service: mongodb
