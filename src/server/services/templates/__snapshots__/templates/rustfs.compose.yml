services:
  rustfs:
    image: rustfs/rustfs:${RUSTFS_VERSION}
    restart: unless-stopped
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
      RUSTFS_OBS_LOGGER_LEVEL: warn
    volumes:
      - data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS http://127.0.0.1:9000/health >/dev/null || wget -q -O /dev/null http://127.0.0.1:9000/health || exit 1
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
    container_name: rustfs-0123abcd-rustfs
    networks:
      default: {}
    labels:
      nitrobase.app: 0123abcd-0000-4000-8000-00000000c0de
      nitrobase.service: rustfs
      nitrobase.routed: "true"
volumes:
  data:
    labels:
      nitrobase.app: 0123abcd-0000-4000-8000-00000000c0de
name: rustfs-0123abcd
