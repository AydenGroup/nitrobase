services:
  plausible_db:
    image: postgres:16-alpine
    restart: always
    volumes:
      - db-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U postgres
      start_period: 1m
    container_name: plausible-0123abcd-plausible_db
    networks:
      default: {}
    labels:
      nitrobase.app: 0123abcd-0000-4000-8000-00000000c0de
      nitrobase.service: plausible_db
  plausible_events_db:
    image: clickhouse/clickhouse-server:24.12-alpine
    restart: always
    volumes:
      - event-data:/var/lib/clickhouse
      - event-logs:/var/log/clickhouse-server
      - /etc/nitrobase/apps/plausible-0123abcd/clickhouse/logs.xml:/etc/clickhouse-server/config.d/logs.xml:ro
      - /etc/nitrobase/apps/plausible-0123abcd/clickhouse/ipv4-only.xml:/etc/clickhouse-server/config.d/ipv4-only.xml:ro
      - /etc/nitrobase/apps/plausible-0123abcd/clickhouse/low-resources.xml:/etc/clickhouse-server/config.d/low-resources.xml:ro
      - /etc/nitrobase/apps/plausible-0123abcd/clickhouse/default-profile-low-resources-overrides.xml:/etc/clickhouse-server/users.d/default-profile-low-resources-overrides.xml:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    environment:
      - CLICKHOUSE_SKIP_USER_SETUP=1
    healthcheck:
      test:
        - CMD-SHELL
        - wget --no-verbose --tries=1 -O - http://127.0.0.1:8123/ping || exit 1
      start_period: 1m
    container_name: plausible-0123abcd-plausible_events_db
    networks:
      default: {}
    labels:
      nitrobase.app: 0123abcd-0000-4000-8000-00000000c0de
      nitrobase.service: plausible_events_db
  plausible:
    image: ghcr.io/plausible/community-edition:v3.2.1
    restart: always
    command: sh -c "/entrypoint.sh db createdb && /entrypoint.sh db migrate && /entrypoint.sh run"
    depends_on:
      plausible_db:
        condition: service_healthy
      plausible_events_db:
        condition: service_healthy
    volumes:
      - plausible-data:/var/lib/plausible
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    environment:
      - TMPDIR=/var/lib/plausible/tmp
      - BASE_URL=${BASE_URL}
      - SECRET_KEY_BASE=${SECRET_KEY_BASE}
      - TOTP_VAULT_KEY
      - DISABLE_REGISTRATION
      - ENABLE_EMAIL_VERIFICATION
      - HTTP_PORT
      - HTTPS_PORT
      - DATABASE_URL
      - CLICKHOUSE_DATABASE_URL
      - GOOGLE_CLIENT_ID
      - GOOGLE_CLIENT_SECRET
      - IP_GEOLOCATION_DB
      - GEONAMES_SOURCE_FILE
      - MAXMIND_LICENSE_KEY
      - MAXMIND_EDITION
      - MAILER_ADAPTER
      - MAILER_EMAIL
      - MAILER_NAME
      - SMTP_HOST_ADDR
      - SMTP_HOST_PORT
      - SMTP_USER_NAME
      - SMTP_USER_PWD
      - SMTP_HOST_SSL_ENABLED
      - POSTMARK_API_KEY
      - MAILGUN_API_KEY
      - MAILGUN_DOMAIN
      - MAILGUN_BASE_URI
      - MANDRILL_API_KEY
      - SENDGRID_API_KEY
    container_name: plausible-0123abcd-plausible
    networks:
      default: {}
    labels:
      nitrobase.app: 0123abcd-0000-4000-8000-00000000c0de
      nitrobase.service: plausible
      nitrobase.routed: "true"
volumes:
  db-data:
    labels:
      nitrobase.app: 0123abcd-0000-4000-8000-00000000c0de
  event-data:
    labels:
      nitrobase.app: 0123abcd-0000-4000-8000-00000000c0de
  event-logs:
    labels:
      nitrobase.app: 0123abcd-0000-4000-8000-00000000c0de
  plausible-data:
    labels:
      nitrobase.app: 0123abcd-0000-4000-8000-00000000c0de
name: plausible-0123abcd
