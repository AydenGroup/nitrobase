# Production: Nitrobase + PostgreSQL on one host (what scripts/install.sh sets up,
# or by hand: see "Install" in README.md).
#   .env holds the secrets and NITROBASE_VERSION (the image tag to run;
#   NITROBASE_IMAGE defaults to the official image):
#   docker compose -f docker-compose.prod.yml up -d
# Build from source instead of pulling a release image:
#   docker compose -f docker-compose.prod.yml -f docker-compose.build.yml up -d --build
# PostgreSQL is NOT published to the host; only the app reaches it.
# Run a single app instance: jobs, server locks and the scheduler are in-process.
# The project name matches the installer's --project-name (COMPOSE_PROJECT).
name: nitrobase

services:
  postgres:
    image: postgres:16-alpine
    container_name: nitrobase_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nitrobase
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (openssl rand -hex 32)}
      POSTGRES_DB: nitrobase
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nitrobase"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    # The in-panel upgrade changes the version variable in .env and recreates
    # this service (Settings → Instance), so the tag must be pinned there.
    image: ${NITROBASE_IMAGE:-ghcr.io/aydengroup/nitrobase}:${NITROBASE_VERSION:?Set NITROBASE_VERSION in .env (image tag, e.g. 0.1.0)}
    container_name: nitrobase_app
    restart: unless-stopped
    # Required to manage the host (Localhost server) through nsenter.
    privileged: true
    pid: host
    # Any setting of src/config/server.ts can be set in .env.
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://nitrobase:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/nitrobase
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY in .env (openssl rand -hex 32)}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env (openssl rand -hex 32)}
      NODE_ENV: production
    volumes:
      # Instance marker (split-brain guard after a self-backup restore).
      - data:/app/.data
    ports:
      # Plain HTTP: put the panel behind HTTPS and set PANEL_BIND=127.0.0.1:3000.
      - "${PANEL_BIND:-0.0.0.0:3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
  data:
    driver: local
