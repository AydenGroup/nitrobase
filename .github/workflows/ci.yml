name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The release workflow runs the same checks before it builds.
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-24.04
    # A newer push to the same pull request replaces the running checks.
    concurrency:
      group: ci-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          # Same Bun as the Dockerfile's base image (oven/bun:<version>-alpine).
          bun-version: 1.3.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Biome
        run: bunx biome check src scripts vite.config.ts

      - name: Tests
        run: bun run test

      - name: i18n catalogs are extracted and translated
        run: |
          bun run i18n:extract
          bun run i18n:compile
          bun run i18n:check
          git diff --exit-code -- src/locales || {
            echo "::error::src/locales is out of date: run bun run i18n:extract and i18n:compile, translate, and commit."
            exit 1
          }

      - name: Installer syntax
        run: bash -n scripts/install.sh

      - name: ShellCheck installer
        # ShellCheck is preinstalled on GitHub's Ubuntu runners.
        run: shellcheck scripts/install.sh
