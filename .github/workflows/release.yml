name: Release

# Push a tag `v<package.json version>` (e.g. v0.1.0-beta.0) to publish:
#   - ghcr.io/<owner>/<repo>:<version> for linux/amd64 and linux/arm64
#     (each built on a runner of its own architecture)
#     (plus :latest for the highest stable version, as for the Release,
#     and the moving :beta for every pre-release; :latest stays stable);
#   - the installer image ghcr.io/<owner>/<repo>-installer with the same
#     tags (installer/Dockerfile: install.sh run through the Docker socket,
#     installing <version> by default);
#   - both images also on Docker Hub (<namespace>/<repo>, same tags) when the
#     DOCKERHUB_USERNAME and DOCKERHUB_TOKEN secrets are set (namespace: the
#     DOCKERHUB_NAMESPACE variable, else the username); GHCR stays the
#     source the installer and the in-panel upgrade use;
#   - a GitHub Release with docker-compose.prod.yml, install.sh and
#     env.example attached (marked pre-release for `-` versions). It becomes
#     the repository's "latest" release only when it is the highest stable
#     version, so tagging a backport (v1.2.4 after v1.3.0) keeps v1.3.0
#     as latest.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    name: Checks
    uses: ./.github/workflows/ci.yml

  version:
    name: Tag matches package.json
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      make_latest: ${{ steps.version.outputs.make_latest }}
      image: ${{ steps.version.outputs.image }}
      installer_image: ${{ steps.version.outputs.installer_image }}
      license: ${{ steps.version.outputs.license }}
    steps:
      - uses: actions/checkout@v7

      - id: version
        name: Compare the tag with package.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(jq -r .version package.json)"
          tag="${GITHUB_REF_NAME}"
          if [ "$tag" != "v$version" ]; then
            echo "::error::tag $tag does not match package.json version $version (expected v$version)"
            exit 1
          fi
          case "$version" in
            *-*) prerelease=true ;;
            *) prerelease=false ;;
          esac
          # "Latest" only for the highest stable version (not a backport).
          make_latest=false
          if [ "$prerelease" = false ]; then
            current="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2>/dev/null || true)"
            highest="$(printf '%s\n%s\n' "$current" "$tag" | sed '/^$/d' | sort -V | tail -n 1)"
            if [ "$highest" = "$tag" ]; then make_latest=true; fi
          fi
          {
            echo "version=$version"
            echo "prerelease=$prerelease"
            echo "make_latest=$make_latest"
            # The image is named after the repository (lowercase for OCI).
            echo "image=ghcr.io/${GITHUB_REPOSITORY,,}"
            # The installer image: the panel image + -installer (install.sh,
            # NITROBASE_INSTALLER_IMAGE default).
            echo "installer_image=ghcr.io/${GITHUB_REPOSITORY,,}-installer"
            echo "license=$(jq -r .license package.json)"
          } >> "$GITHUB_OUTPUT"

  # One native build per architecture (arm64 under QEMU took over the
  # 2 h job limit), pushed to GHCR by digest; `image` then tags both
  # digests as one multi-arch image.
  build:
    name: Build ${{ matrix.image }} (${{ matrix.arch }})
    needs: [checks, version]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      # The release needs every image.
      fail-fast: true
      matrix:
        image: [panel, installer]
        arch: [amd64, arm64]
        include:
          - image: panel
            file: Dockerfile
            title: Nitrobase
            name: ${{ needs.version.outputs.image }}
            build-args: ""
          - image: installer
            file: installer/Dockerfile
            title: Nitrobase installer
            name: ${{ needs.version.outputs.installer_image }}
            # Installs its own version by default; names itself in hints.
            build-args: |
              VERSION=${{ needs.version.outputs.version }}
              INSTALLER_IMAGE=${{ needs.version.outputs.installer_image }}
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.file }}
          build-args: ${{ matrix.build-args }}
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ matrix.name }},push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.title=${{ matrix.title }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.url=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=${{ needs.version.outputs.license }}
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.arch }}

      - name: Keep the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.image }}-${{ matrix.arch }}
          path: digests/*
          if-no-files-found: error
          retention-days: 1

  image:
    name: Image ${{ matrix.image }} (amd64 + arm64)
    needs: [version, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - image: panel
            title: Nitrobase
            name: ${{ needs.version.outputs.image }}
          - image: installer
            title: Nitrobase installer
            name: ${{ needs.version.outputs.installer_image }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: digest-${{ matrix.image }}-*
          path: digests
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker Hub mirror, when the repository has the DOCKERHUB_USERNAME and
      # DOCKERHUB_TOKEN secrets: <namespace>/<GHCR image name>, the namespace
      # being the DOCKERHUB_NAMESPACE variable (an organization) or the user.
      # Computed here: job outputs cannot carry values derived from secrets.
      - id: images
        name: Image names
        env:
          GHCR_IMAGE: ${{ matrix.name }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
        run: |
          namespace="$(printf '%s' "${DOCKERHUB_NAMESPACE:-$DOCKERHUB_USERNAME}" | tr '[:upper:]' '[:lower:]')"
          {
            echo "list<<EOF"
            echo "$GHCR_IMAGE"
            if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
              echo "docker.io/$namespace/${GHCR_IMAGE##*/}"
            fi
            echo "EOF"
            if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
              echo "dockerhub=true"
            else
              echo "dockerhub=false"
            fi
          } >> "$GITHUB_OUTPUT"
          if [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::notice::No DOCKERHUB_USERNAME/DOCKERHUB_TOKEN secrets: publishing to GHCR only."
          fi

      - if: steps.images.outputs.dockerhub == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        env:
          # Annotations on the multi-arch index.
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index
        with:
          images: ${{ steps.images.outputs.list }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ needs.version.outputs.version }}
            type=raw,value=latest,enable=${{ needs.version.outputs.make_latest == 'true' }}
            # Pre-release channel (install.sh PRERELEASE_IMAGE_TAG).
            type=raw,value=beta,enable=${{ needs.version.outputs.prerelease == 'true' }}
          labels: |
            org.opencontainers.image.title=${{ matrix.title }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.url=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=${{ needs.version.outputs.license }}

      - name: Tag the multi-arch image
        working-directory: digests
        env:
          GHCR_IMAGE: ${{ matrix.name }}
        run: |
          args=()
          while IFS= read -r tag; do args+=(-t "$tag"); done < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          while IFS= read -r note; do args+=(--annotation "$note"); done < <(jq -r '.annotations[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          for digest in *; do args+=("$GHCR_IMAGE@sha256:$digest"); done
          docker buildx imagetools create "${args[@]}"
          docker buildx imagetools inspect "$GHCR_IMAGE:$DOCKER_METADATA_OUTPUT_VERSION"

  release:
    name: GitHub Release
    needs: [version, image]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Collect the release assets
        run: |
          mkdir -p dist
          cp docker-compose.prod.yml dist/docker-compose.prod.yml
          cp scripts/install.sh dist/install.sh
          # No leading dot: download it as .env (README, Install).
          cp .env.example dist/env.example

      # Third-party actions are pinned to a commit.
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: Nitrobase ${{ needs.version.outputs.version }}
          prerelease: ${{ needs.version.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.version.outputs.make_latest }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/docker-compose.prod.yml
            dist/install.sh
            dist/env.example
