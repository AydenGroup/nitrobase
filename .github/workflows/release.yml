name: Release

# Push a tag `v<package.json version>` (e.g. v0.1.0-beta.0) to publish:
#   - ghcr.io/<owner>/<repo>:<version> for linux/amd64 and linux/arm64
#     (plus :latest for the highest stable version, as for the Release);
#   - the installer image ghcr.io/<owner>/<repo>-installer with the same
#     tags (installer/Dockerfile: install.sh run through the Docker socket,
#     installing <version> by default);
#   - a GitHub Release with docker-compose.prod.yml, install.sh and
#     env.example attached (marked pre-release for `-` versions). It becomes
#     the repository's "latest" release only when it is the highest stable
#     version, so tagging a backport (v1.2.4 after v1.3.0) keeps v1.3.0
#     as latest.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    name: Checks
    uses: ./.github/workflows/ci.yml

  version:
    name: Tag matches package.json
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      make_latest: ${{ steps.version.outputs.make_latest }}
      image: ${{ steps.version.outputs.image }}
      installer_image: ${{ steps.version.outputs.installer_image }}
      license: ${{ steps.version.outputs.license }}
    steps:
      - uses: actions/checkout@v4

      - id: version
        name: Compare the tag with package.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(jq -r .version package.json)"
          tag="${GITHUB_REF_NAME}"
          if [ "$tag" != "v$version" ]; then
            echo "::error::tag $tag does not match package.json version $version (expected v$version)"
            exit 1
          fi
          case "$version" in
            *-*) prerelease=true ;;
            *) prerelease=false ;;
          esac
          # "Latest" only for the highest stable version (not a backport).
          make_latest=false
          if [ "$prerelease" = false ]; then
            current="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2>/dev/null || true)"
            highest="$(printf '%s\n%s\n' "$current" "$tag" | sed '/^$/d' | sort -V | tail -n 1)"
            if [ "$highest" = "$tag" ]; then make_latest=true; fi
          fi
          {
            echo "version=$version"
            echo "prerelease=$prerelease"
            echo "make_latest=$make_latest"
            # The image is named after the repository (lowercase for OCI).
            echo "image=ghcr.io/${GITHUB_REPOSITORY,,}"
            # The installer image: the panel image + -installer (install.sh,
            # NITROBASE_INSTALLER_IMAGE default).
            echo "installer_image=ghcr.io/${GITHUB_REPOSITORY,,}-installer"
            echo "license=$(jq -r .license package.json)"
          } >> "$GITHUB_OUTPUT"

  image:
    name: Image ${{ matrix.image }} (amd64 + arm64)
    needs: [checks, version]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    strategy:
      # The release needs both images.
      fail-fast: true
      matrix:
        include:
          - image: panel
            file: Dockerfile
            title: Nitrobase
            name: ${{ needs.version.outputs.image }}
            build-args: ""
          - image: installer
            file: installer/Dockerfile
            title: Nitrobase installer
            name: ${{ needs.version.outputs.installer_image }}
            # Installs its own version by default; names itself in hints.
            build-args: |
              VERSION=${{ needs.version.outputs.version }}
              INSTALLER_IMAGE=${{ needs.version.outputs.installer_image }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        env:
          # Annotations on the image manifests and the multi-arch index.
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ matrix.name }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ needs.version.outputs.version }}
            type=raw,value=latest,enable=${{ needs.version.outputs.make_latest == 'true' }}
          labels: |
            org.opencontainers.image.title=${{ matrix.title }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.url=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=${{ needs.version.outputs.license }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          build-args: ${{ matrix.build-args }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  release:
    name: GitHub Release
    needs: [version, image]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Collect the release assets
        run: |
          mkdir -p dist
          cp docker-compose.prod.yml dist/docker-compose.prod.yml
          cp scripts/install.sh dist/install.sh
          # No leading dot: download it as .env (README, Install).
          cp .env.example dist/env.example

      # Third-party actions are pinned to a commit.
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ github.ref_name }}
          name: Nitrobase ${{ needs.version.outputs.version }}
          prerelease: ${{ needs.version.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.version.outputs.make_latest }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/docker-compose.prod.yml
            dist/install.sh
            dist/env.example
